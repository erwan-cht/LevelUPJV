# Limites de débit de LevelUPJV (installées dans /etc/nginx/conf.d/ sur le VPS).
#
# Elles protègent la connexion contre les essais en rafale, mais une salle de TD ou un amphi entier arrive avec UNE SEULE adresse
# IP (le réseau de l'IUT) : les valeurs doivent laisser passer une classe qui se connecte en même temps.
#   - connexion : 30 par minute en continu, rafale de 40 (une classe de 30 qui se connecte d'un coup)
#   - API : 100 requêtes par seconde, rafale de 300 (30 étudiants qui chargent une page = environ 200 appels d'un coup)
limit_req_zone $binary_remote_addr zone=levelupjv_login:2m rate=30r/m;
limit_req_zone $binary_remote_addr zone=levelupjv_api:2m rate=100r/s;
