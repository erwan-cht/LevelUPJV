# Site LevelUPJV (installé dans /etc/nginx/sites-available/levelupjv sur le VPS, port 8090).
# Les zones de limitation (levelupjv_login, levelupjv_api) sont définies dans levelupjv-limits.conf.
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /var/www/levelupjv;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 100k;

    location = /api/auth/login {
        limit_req zone=levelupjv_login burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Les flux en direct de l'arène (SSE) passent ici : l'API envoie un signe de vie toutes les 10 s, avant ce délai de 15 s.
    location /api/ {
        limit_req zone=levelupjv_api burst=300 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
