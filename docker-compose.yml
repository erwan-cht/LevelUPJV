# PostgreSQL de développement, identique pour toute l'équipe.
#   docker compose up -d     démarrer
#   docker compose down      arrêter (les données restent dans le volume)
#   docker compose down -v   arrêter ET effacer les données
services:
  db:
    image: postgres:16
    container_name: levelupjv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: levelup
      POSTGRES_PASSWORD: levelup_dev
      POSTGRES_DB: levelupjv
    ports:
      - "5432:5432"
    volumes:
      - levelupjv-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levelup -d levelupjv"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  levelupjv-pgdata:
